name: TG Publicações · robô

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  volta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Correr o robô
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          META_TOKEN_TODOSGANHAM: ${{ secrets.META_TOKEN_TODOSGANHAM }}
        run: python robo/robo.py
      - name: Guardar o estado
        if: always()
        run: |
          git config user.name "TG Publicações"
          git config user.email "actions@github.com"
          git add estado/
          git diff --cached --quiet || (git commit -m "Estado do robô" && git pull --rebase && git push)
